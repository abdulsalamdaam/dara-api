# Runs ZATCA's OWN validator (the Fatoora SDK) over one of every document shape
# Dara can issue, and fails the build on anything it does not pass.
#
# This exists because the B2C signing bug was invisible to us: sandbox accepted
# the documents, clearance re-stamps standard ones and never checks ours, and
# only ZATCA's production reporting endpoint objected — with an error that
# pointed at the wrong thing. The SDK answers the same question offline, before
# a seller ever sees it.
#
# Nothing here contacts ZATCA. The SDK is a local validator and that is the
# whole point: it rules on the DOCUMENT — XSD, EN16931, the KSA business rules,
# the QR, the signature and the PIH — without a network call, a certificate
# request, or a submission anybody has to live with.
#
# The SDK is pinned by commit AND by the SHA-256 of its jar; a changed jar
# fails the job rather than running.
#
# Trigger is manual for now. The job is a gate we want to run deliberately
# while the real-document samples are still being read, not one that turns
# every push red on a verdict nobody has looked at yet. Put `push` back when
# the matrix is green and expected to stay that way.
name: ZATCA validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # ZATCA publishes the SDK behind a JS-gated download page with no stable
      # URL, so it is taken from a public mirror and pinned by commit AND by the
      # SHA-256 of the jar (R3.4.8, 23,947,837 bytes). R3.2.7, the previous pin,
      # predates the format rules (BR-KSA-F-07…F-13), BR-KSA-99 and three
      # zero-rated codes that the live endpoints enforce today.
      SDK_REPO: https://github.com/aashahin/zatca-sdk.git
      SDK_COMMIT: 7ed29640512e158e12ca623c9841a46a3962f710
      SDK_DIR: resources/examples/zatca-einvoicing-sdk-Java-238-R3.4.8
      SDK_JAR: Apps/zatca-einvoicing-sdk-238-R3.4.8.jar
      SDK_JAR_SHA256: 48abeb828d453ef6fafba792fddbbb2701da5c7018c24bde918853e80ff5d530
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The signer shells out to these three.
      - name: Install xmllint / xsltproc
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils xsltproc

      # ZATCA mandates secp256k1, which SunEC dropped after JDK 15 — the SDK's
      # signature check silently reports "Curve not supported" on newer JDKs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Fetch the ZATCA SDK (pinned)
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk && cd /tmp/sdk
          git init -q
          git remote add origin "$SDK_REPO"
          git config core.sparseCheckout true
          echo "$SDK_DIR/*" > .git/info/sparse-checkout
          git fetch -q --depth 1 origin "$SDK_COMMIT"
          git checkout -q FETCH_HEAD
          echo "$SDK_JAR_SHA256  $SDK_DIR/$SDK_JAR" | sha256sum -c -
          # The tree the rest of the job uses, at the path config.json names.
          mv "$SDK_DIR" einvoicing-sdk
          chmod +x einvoicing-sdk/Apps/fatoora
          # R3.4.x ships config.json with Windows paths, and its own install.sh
          # writes `Data/Rules/schematrons` while the folder is `Schematrons` —
          # on Linux that points at nothing. So the config is written here,
          # against the files that exist, the way install.sh means to.
          R=/zatca
          jq -n --arg xsd "$R/Data/Schemas/xsds/UBL2.1/xsd/maindoc/UBL-Invoice-2.1.xsd" \
                --arg en "$R/Data/Rules/Schematrons/CEN-EN16931-UBL.xsl" \
                --arg ksa "$R/Data/Rules/Schematrons/20210819_ZATCA_E-invoice_Validation_Rules.xsl" \
                --arg cert "$R/Data/Certificates/cert.pem" \
                --arg key "$R/Data/Certificates/ec-secp256k1-priv-key.pem" \
                --arg pih "$R/Data/PIH/pih.txt" \
                --arg input "$R/Data/Input" \
                --arg usage "$R/Configuration/usage.txt" \
                '{xsdPath:$xsd, enSchematron:$en, zatcaSchematron:$ksa, certPath:$cert, privateKeyPath:$key, pihPath:$pih, inputPath:$input, usagePathFile:$usage}' \
                > einvoicing-sdk/Configuration/config.json
          test -f einvoicing-sdk/Data/Rules/Schematrons/20210819_ZATCA_E-invoice_Validation_Rules.xsl
          test -f einvoicing-sdk/Data/Certificates/ec-secp256k1-priv-key.pem
          grep -q '238-R3.4.8' einvoicing-sdk/Apps/global.json

      - name: Sign the document matrix with the SDK's own test certificate
        run: |
          set -euo pipefail
          CERTS=/tmp/sdk/einvoicing-sdk/Data/Certificates
          # The SDK stores both as bare base64 bodies; our signer wants PEM.
          { echo "-----BEGIN CERTIFICATE-----"; fold -w64 "$CERTS/cert.pem"; \
            echo; echo "-----END CERTIFICATE-----"; } > /tmp/cert.pem
          { echo "-----BEGIN EC PRIVATE KEY-----"; fold -w64 "$CERTS/ec-secp256k1-priv-key.pem"; \
            echo; echo "-----END EC PRIVATE KEY-----"; } > /tmp/key.pem
          pnpm exec tsx scripts/zatca-sample-matrix.ts \
            --cert /tmp/cert.pem --key /tmp/key.pem --out /tmp/samples

      - name: Validate every document against ZATCA's rules
        run: |
          set -euo pipefail
          # config.json hardcodes /zatca paths, so the tree has to live there.
          sudo mkdir -p /zatca
          sudo cp -r /tmp/sdk/einvoicing-sdk/. /zatca/
          sudo chown -R "$USER" /zatca
          cp /tmp/samples/pih.txt /zatca/Data/PIH/pih.txt
          export FATOORA_HOME=/zatca/Apps
          export SDK_CONFIG=/zatca/Configuration/config.json
          export PATH="$FATOORA_HOME:$PATH"
          failed=0
          for f in /tmp/samples/*.xml; do
            name=$(basename "$f")
            out=$(fatoora -validate -invoice "$f" 2>&1 || true)
            # The SDK's full report, verbatim, inside the fold. The greps below
            # are a summary; a warning the summary does not match is still a
            # thing we want to be able to read afterwards.
            echo "::group::$name"
            echo "$out"
            echo "::endgroup::"
            echo "$out" | grep -E "validation result|GLOBAL VALIDATION|CODE :" || true
            if echo "$out" | grep -q "GLOBAL VALIDATION RESULT = PASSED"; then
              echo "PASSED  $name"
            else
              echo "::error::ZATCA validation failed for $name"
              echo "$out" | grep -E "CODE :" || true
              failed=1
            fi
          done
          exit $failed

      # A validator that cannot fail is not a validator. Break one document on
      # purpose and require the SDK to notice — otherwise a harness that has
      # quietly stopped checking anything would report green forever.
      #
      # `always()`: this must run even when a document above failed. A red
      # matrix is exactly when someone needs to know whether the validator is
      # still capable of saying no.
      - name: Prove the validator still rejects a bad document
        if: always()
        run: |
          set -euo pipefail
          export FATOORA_HOME=/zatca/Apps
          export SDK_CONFIG=/zatca/Configuration/config.json
          export PATH="$FATOORA_HOME:$PATH"
          # Corrupt the SignedProperties digest — the exact failure that shipped.
          sed 's|<ds:DigestValue>\([A-Za-z0-9+/]\{80\}\)|<ds:DigestValue>AAAA\1|' \
            /tmp/samples/04-simplified-invoice.xml > /tmp/tampered.xml
          if ! cmp -s /tmp/samples/04-simplified-invoice.xml /tmp/tampered.xml; then
            :
          else
            echo "::error::negative control did not modify the document"; exit 1
          fi
          out=$(fatoora -validate -invoice /tmp/tampered.xml 2>&1 || true)
          echo "$out" | grep -E "validation result|GLOBAL VALIDATION" || true
          if echo "$out" | grep -q "GLOBAL VALIDATION RESULT = PASSED"; then
            echo "::error::the validator passed a document with a corrupted signed-properties digest — the harness is not checking anything"
            exit 1
          fi
          echo "Negative control OK: the validator rejects a tampered document."
