# Push -> deploy, without the GitHub App.
#
# Coolify sources these apps from the GitHub App "mlika-abdulsalam", which
# stopped delivering push events. Repo-level webhooks cannot substitute: their
# payload carries no `installation` object, so Coolify answers 200 and matches
# no application. Fixing the App's webhook URL is browser-only — no personal
# access token can manage a GitHub App — so this calls Coolify's deploy API
# directly instead, which needs nothing from the App.
#
# COOLIFY_TOKEN is a repository secret (Coolify API token).
name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer commit supersedes an in-flight deploy of an older one.
  group: coolify-deploy-dara-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::error::COOLIFY_TOKEN secret is not set on this repository."
            exit 1
          fi
          deploy() {
            name=$1; uuid=$2
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json" \
              "https://coolify.dara-sa.net/api/v1/deploy?uuid=$uuid&force=false")
            echo "$name: HTTP $code"; cat /tmp/resp.json; echo
            [ "$code" = "200" ] || { echo "::error::$name returned $code"; return 1; }
            grep -qi "deployment queued" /tmp/resp.json || {
              echo "::error::$name did not queue a deployment"; return 1; }
          }
          # Staging first: a broken build fails here before production moves.
          deploy staging rg2fzzvc8wnxd8njnyi1bqxu
          deploy production c7uop7f14t07mtrsn5060uoj
          # A queued deploy is the success condition; anything else must fail
          # the job loudly rather than look green while nothing ships.
