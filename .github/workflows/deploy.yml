# Branch -> environment. Coolify's GitHub App stopped delivering push events, so
# this calls Coolify's deploy API directly instead; it needs nothing from the App.
#   main   -> production   (dara-sa.net / api.dara-sa.net)
#   master -> staging      (staging.dara-sa.net / api-staging.dara-sa.net)
# COOLIFY_TOKEN is a repository secret.
# NOT gated on ci.yml yet — deliberately: nobody has seen that job green, and a
# red CI must not be the first thing that ever blocks a deploy. Gate it once it
# has run clean for a while; that is a follow-up, not an oversight.
name: Deploy to Coolify

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: coolify-${{ github.ref_name }}-dara-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::error::COOLIFY_TOKEN secret is not set."; exit 1
          fi
          case "$BRANCH" in
            main)   TARGET=production; UUID=c7uop7f14t07mtrsn5060uoj ;;
            master) TARGET=staging;    UUID=rg2fzzvc8wnxd8njnyi1bqxu ;;
            *) echo "No environment mapped to $BRANCH — nothing to do."; exit 0 ;;
          esac
          echo "Deploying $TARGET from $BRANCH"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" \
            "https://coolify.dara-sa.net/api/v1/deploy?uuid=$UUID&force=false")
          echo "HTTP $code"; cat /tmp/resp.json; echo
          # A queued deploy is the only success condition — never pass silently.
          [ "$code" = "200" ] || { echo "::error::$TARGET returned $code"; exit 1; }
          grep -qi "deployment queued" /tmp/resp.json || {
            echo "::error::$TARGET did not queue a deployment"; exit 1; }
